# Manual verification checklist (canonical). Edit this file, not the Issue:
#   python project/tools/manual_check.py --markdown   -> paste into the tracking Issue
# status: pending | ok | ng | skip   (record details in `result`)
schema_version: 1
tracking_issue: 14
environment_hint: "Windows 10/11, Python 3.10+ (python.org build with tkinter), after `knt.cmd setup`"
checks:
  - id: jp-font
    area: rendering
    from: "#6, #10"
    steps:
      - "python project/tools/manual_check.py --prepare"
      - "python project/tools/run_mviser.py frame project/samples/sample.mvproj.yaml --time 4 -o project/output/check_h.png"
      - "python project/tools/run_mviser.py frame project/samples/sample.mvproj.yaml --time 9.5 -o project/output/check_v.png"
    expected: "Japanese lyrics and ruby render (no □); horizontal ruby above base, vertical ruby to the right"
    status: pending
    result: ""
  - id: gui-basic
    area: gui
    from: "#10"
    steps:
      - "python project/tools/run_mviser.py gui project/samples/sample.mvproj.yaml"
      - "Click / drag the timeline, use ←/→, ↑/↓, Space"
      - "Edit project/samples/sample.mvproj.yaml in an editor and save"
    expected: "Preview follows seek; readout shows time / measure:beat / chord (roman); saved edits appear within ~1 s"
    status: pending
    result: ""
  - id: gui-audio
    area: audio
    from: "#12"
    steps:
      - "In the GUI press Space to play; press M to mute / unmute"
    expected: "Click track is audible and the chord changes land on the accented clicks; no status warning about audio"
    status: pending
    result: ""
  - id: gui-export
    area: gui
    from: "#10"
    steps:
      - "GUI: File → Export MP4…, then File → Export PNG frames…"
    expected: "Status bar shows progress and 'done'; MP4 plays with audio; PNGs are numbered by frame"
    status: pending
    result: ""
  - id: gui-settings
    area: gui
    from: "#16"
    steps:
      - "GUI: Settings → Project settings…, override Motion → Beat pulse, Save"
      - "GUI: Settings → Global settings…, set Style → Text colour, Save; open another project"
    expected: "Preview updates after Save; project YAML keeps its comments and only gains the overridden key; global value applies to projects that do not override it"
    status: pending
    result: ""
  - id: gui-waveform
    area: gui
    from: "#18"
    steps:
      - "Open a project with your own song audio in the GUI"
    expected: "Waveform row under the lyric row matches the song; measure lines and numbers line up with bar starts; playback stays smooth"
    status: pending
    result: ""
  - id: side-text
    area: rendering
    from: "#19"
    steps:
      - "python project/tools/run_mviser.py gui project/samples/sample.mvproj.yaml  (play from bar 2)"
    expected: "Lyric '焦がれ' repeats faintly down both margins and scrolls smoothly; it fades in with the lyric and stops at the next lyric"
    status: pending
    result: ""
  - id: gui-conveniences
    area: gui
    from: "#20"
    steps:
      - "Open two different projects via File → Open…, restart the GUI, check File → Recent"
      - "View → Chord colours off/on; press G for guidelines; export a frame afterwards"
    expected: "Recent lists both (newest first); colours toggle only in the preview; guides visible in preview but not in exported frames"
    status: pending
    result: ""
  - id: alpha-layers
    area: output
    from: "#23"
    steps:
      - "python project/tools/run_mviser.py render project/samples/sample.mvproj.yaml --layers chords,lyrics --format prores4444 -o project/output/text.mov"
      - "python project/tools/run_mviser.py render project/samples/sample.mvproj.yaml --split-layers --frames project/output/layers"
      - "Place text.mov above an illustration in After Effects; import the layer PNG folders into AviUtl"
    expected: "Text layers are transparent outside the glyphs in AE and AviUtl; layers stay in sync with the audio-bearing full render"
    status: pending
    result: ""
  - id: subtitle-editor
    area: gui
    from: "#25"
    steps:
      - "GUI: Window → Subtitle editor (Ctrl+L); play, pause at a phrase start, type text, Add at playhead, Save"
      - "Select a line, move the playhead, Set time = playhead, Save; open the YAML in an editor"
    expected: "Preview and timeline update after Save; YAML keeps comments, new times are quoted \"M:B.bb\" and land on the same frame"
    status: pending
    result: ""
  - id: follow-timeinfo
    area: gui
    from: "#27"
    steps:
      - "Set `vertical: true` on one lyric and `vertical: follow` on the next; preview both"
      - "GUI: View → Time: tempo / frames; Help → Project info"
    expected: "Second lyric is vertical too; readout switches format; project info lists title, bpm/key, fps/resolution, duration, counts, sets, audio"
    status: pending
    result: ""
  - id: handoff
    area: output
    from: "#29"
    steps:
      - "python project/tools/run_mviser.py handoff project/samples/sample.mvproj.yaml -o project/output/handoff"
      - "AviUtl: drag sample.exo onto the exedit timeline (L-SMASH Works input plugin needed for .mov)"
      - "After Effects: File → Scripts → Run Script File… → sample.jsx"
    expected: "AviUtl shows 3 layered video objects + audio with transparency, correct length/fps; AE creates a comp with the layers in order and audio. If exedit rejects keys, note which (templates in project/src/mviser/templates/ are edited)"
    status: pending
    result: ""
  - id: theme-prefs
    area: gui
    from: "#31"
    steps:
      - "GUI: View → Theme: dark, View → Time: tempo, press G; close and reopen the GUI"
    expected: "Dark theme is readable (buttons, tables, status bar, subtitle editor, settings); theme / time mode / guides are restored after restart"
    status: pending
    result: ""
  - id: side-panel
    area: gui
    from: "#33"
    steps:
      - "GUI: side panel on the right; add / edit a lyric in the Subtitles tab and Save; open the Chords tab and double-click rows"
      - "Type spaces in the text field (must not start playback); F9 toggles the panel; resize it, restart the GUI"
    expected: "Docked editing works like the separate window; chord rows seek and follow playback; panel visibility and width are restored"
    status: pending
    result: ""
  - id: midi-fl
    area: input
    from: "#2 (MVP-1)"
    steps:
      - "Export a chord track from FL Studio as .mid next to a project file"
      - "Add `imports: [{format: midi, path: <file>.mid, at: \"1:1\"}]` and set project.bpm to the FL tempo"
      - "python project/tools/run_mviser.py inspect <project>"
    expected: "Chords are split where the harmony changes; strums are merged; names look right (tune `window` / `min_duration` if not)"
    status: pending
    result: ""
  - id: aviutl-ae
    area: output
    from: "#1 workflow"
    steps:
      - "python project/tools/run_mviser.py render project/samples/sample.mvproj.yaml --frames project/output/frames --start 0 --end 4"
      - "Import the PNG sequence into AviUtl and/or After Effects"
    expected: "Sequence imports at the project fps with correct length"
    status: pending
    result: ""
