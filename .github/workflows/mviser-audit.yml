name: MViser audit

# Machine-verifiable review evidence (MViser#38, ADR 0005): runs `mviser audit`
# with the real Tk GUI (Xvfb on Linux, desktop session on Windows) and uploads
# the JSON report, markdown summary and evidence files.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Linux GUI / font prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-ipafont-gothic python3-tk
      - name: Install dependencies
        run: python -m pip install -r project/requirements.txt
      - name: Audit (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python project/tools/run_mviser.py audit --out audit-out --gui on
      - name: Audit (Windows)
        if: runner.os == 'Windows'
        run: python project/tools/run_mviser.py audit --out audit-out --gui on
      - name: Job summary
        if: always()
        shell: bash
        run: cat audit-out/audit_summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mviser-audit-${{ matrix.os }}
          path: audit-out/
          retention-days: 30
